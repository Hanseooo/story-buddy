[project]
name = "storybuddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.1",
    "psycopg[binary]>=3.2",
    "openai>=1.99",
    "fal-client>=0.7",
    "httpx>=0.27",
    "supabase>=2.9.1",
    "redis>=5.2",
    "rq>=2.0",
    "sentry-sdk[fastapi]>=2.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
