[project]
name = "storybuddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.1",
    "psycopg[binary]>=3.2",
    "openai>=1.99",
    "fal-client>=0.7",
    "httpx>=0.27",
    "supabase>=2.9.1",
    "redis>=5.2",
    "rq>=2.0",
    "sentry-sdk[fastapi]>=2.17",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "transformers>=4.40",
    "torch>=2.0",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# `ruff check` only. `ruff format` is deliberately NOT adopted: its 88-column default rewraps
# every file in the repo, so a one-line change arrives as a 200-line diff. Adopt it only via a
# single repo-wide formatting commit, never inside a feature change.
[tool.ruff]
line-length = 120
