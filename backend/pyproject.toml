[project]
name = "storybuddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.1",
    "psycopg[binary]>=3.2",
    "openai>=1.99",
    "fal-client>=0.7",
    "httpx>=0.27",
    "supabase>=2.9.1",
    "redis>=5.2",
    "rq>=2.0",
    "sentry-sdk[fastapi]>=2.17",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # NOT transformers/torch. ADR-032 moved every local model to OpenRouter, so nothing here
    # imports them -- but presidio_analyzer/nlp_engine/__init__.py imports TransformersNlpEngine
    # unconditionally, so merely having them installed costs +244 MB resident (measured: 455 MB
    # -> 211 MB) and OOM-kills the 512 MB worker inside input_gate's redact_pii call. Presidio
    # guards the import (transformers_nlp_engine.py try/except ImportError), so it degrades to
    # SpacyNlpEngine cleanly. Re-adding either dependency re-arms the OOM.
    "Pillow>=10.0",
    "langfuse>=2.0",
    "langchain>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Smoke tests hit real provider APIs and cost real money — opt in, never on by default.
#   uv run pytest -m "smoke and not smoke_image"   # text/judge/moderation, six small-model pings
#   uv run pytest -m smoke                         # the above plus one paid fal.ai draw
addopts = "-m 'not smoke'"
markers = [
    "smoke: calls a real provider API. Verifies every model in app/config.py is reachable and honours the contract the pipeline needs. Run before any deploy that changes a model name or base URL.",
    "smoke_image: a smoke test that additionally pays for one image generation.",
]

# `ruff check` only. `ruff format` is deliberately NOT adopted: its 88-column default rewraps
# every file in the repo, so a one-line change arrives as a 200-line diff. Adopt it only via a
# single repo-wide formatting commit, never inside a feature change.
[tool.ruff]
line-length = 120
