# QLoRA config for the consistency judge (`docs/specs/judge-finetune.md` §6.3).
#
#   llamafactory-cli train backend/finetune/train_qlora.yaml
#
# Run it three times with seed: 0, 1, 2 and report mean ± std — at ~1,000 examples a single-seed
# delta is noise (§6.4). CC-7 requires pinning: base revision hash, rank + alpha, seed(s), the
# manifest hash, image_max_pixels, LLaMA-Factory version (§6.6).

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
model_revision: PIN_THE_EXACT_COMMIT_HASH   # CC-7. Not "main" — grab it from the model card (§13).
image_max_pixels: 262144                    # 512 x 512
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
quantization_bit: 4                         # the Q in QLoRA
quantization_method: bnb

### dataset
# Registered by `to_llamafactory.DATASET_INFO`; regenerate, never hand-edit (§5.3).
dataset: storybuddy_judge_train
eval_dataset: storybuddy_judge_val          # character-disjoint, synthetic corpus. §3.2
dataset_dir: data/judge
template: qwen2_vl
cutoff_len: 2048

### output
output_dir: saves/judge-lora-seed0
report_to: wandb
run_name: judge-qlora-seed0
plot_loss: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
seed: 0

### eval
eval_strategy: steps
eval_steps: 50
load_best_model_at_end: true                # early stopping on the disjoint val split

# Checkpoint selection (pre-registered 2026-07-13): early stopping stays on eval loss, but the
# REPORTED checkpoint per seed is selected by `different_character` F1 on the validation split —
# token-level loss is dominated by the majority class and by rationale tokens. Score saved
# checkpoints with `finetune/evaluate.py` over the ~75 validation pairs.
#
# `storybuddy_judge_test` is registered too and is deliberately NOT referenced here: the held-out
# split is read exactly once, after training, by evaluate.py (§5.5, §7.5).
