# pnpm 12 requires an explicit decision per package with a build script. These three keep the
# false they already had as `ignoredBuiltDependencies` -- their prebuilt binaries are what the
# working tree has always used; nothing here is a new grant.
allowBuilds:
  '@sentry/cli': false
  sharp: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - '@sentry/cli'
  - sharp
  - unrs-resolver
