# pnpm 12 requires an explicit decision per package with a build script, so `pnpm install` now
# hard-errors without this block. Every entry is `false`: `sharp` and `unrs-resolver` already had
# that state via `ignoredBuiltDependencies`. Nothing here grants a build script that was previously running.
allowBuilds:
  sharp: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
